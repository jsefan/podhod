<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Подход</title>
<meta name="description" content="Workout log: templates, sets, history">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Подход">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0E0E0E">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;1,600;1,700;1,800;1,900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Theme "Moto, black" (D2): black ground, neon yellow + hot pink accents, slanted racing cuts, italic condensed display type */
:root{
  --bg:#0E0E0E; --surface:#1C1C1C; --sunk:#2C2C2C; --ink:#FFFFFF; --muted:#A8A8A8; --line:#333333;
  --accent:#FFE11A; --accent-ink:#141414; --accent-soft:rgba(255,225,26,.12);
  --pink:#FF2E93; --pink-ink:#141414;
  --done:#FF2E93; --done-bg:#3A3A3A; --warn:#FF6B6B; --warn-bg:#3A1A1A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:4px;
  --cut:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
  --cut-lg:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%);
  --card:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,18px 100%,0 calc(100% - 18px));
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{background:var(--bg)}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
html{overflow-x:clip}
body{overflow-x:clip;margin:0;color:var(--ink);font:15px/1.45 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:env(safe-area-inset-top,0px) calc(88px + env(safe-area-inset-bottom,0px))}
button,a,label,summary{touch-action:manipulation}
[hidden]{display:none!important}
img{max-width:100%}
input,select,textarea{font-size:16px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:620px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;letter-spacing:.01em;line-height:1;text-wrap:balance;margin:0}
h1{font-size:40px;font-weight:900}
h2{font-size:26px}
h3{font-size:21px}
.num{font-family:var(--display);font-style:italic;font-weight:800;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--pink);outline-offset:2px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg),0 1px 0 100vmax #2A2A2A;clip-path:inset(0 -100vmax -1px);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px 18px;margin-bottom:6px}
.top::before,.top::after{content:"";position:absolute;right:-40px;background:var(--pink);transform:skewX(-30deg);pointer-events:none}
.top::before{bottom:6px;width:58%;height:6px}
.top::after{bottom:0;width:40%;height:3px}
.top .brand{font-family:var(--display);font-style:italic;font-weight:900;font-size:30px;letter-spacing:.01em;line-height:1}
.top .brand b{color:var(--accent);font-weight:900}
.banner{background:var(--accent-soft);border-left:0;padding:10px 12px;font-size:13px;margin-bottom:12px;clip-path:var(--cut)}
.banner.warn{background:var(--warn-bg);color:var(--ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 20px;border:0;background:#262626;color:var(--accent);font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;letter-spacing:.04em;text-transform:uppercase;clip-path:var(--cut)}
.btn:hover{background:#303030}
.btn:focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--pink)}
.btn.primary{background:var(--pink);color:var(--pink-ink);font-weight:900}
.btn.primary:hover{filter:brightness(1.08);background:var(--pink)}
.btn.danger{background:var(--warn-bg);color:var(--warn)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:#262626}
.btn.ghost:disabled{opacity:.35}
.btn.small{min-height:38px;padding:0 14px;font-size:16px}
.btn.block{width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:12px}
.section{display:flex;flex-direction:column;gap:12px;margin-top:24px}

.card{background:var(--surface);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0;clip-path:var(--card)}
.card .meta{font-size:13px;color:var(--muted)}
.card .list{font-size:14px;color:var(--ink);margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:2px}
.card .list li{display:flex;justify-content:space-between;gap:12px}
.card .list li span:last-child{color:var(--muted);white-space:nowrap;font-family:var(--display);font-style:italic;font-weight:700;font-size:17px}
.tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--accent);color:var(--accent-ink)}

.start{background:var(--surface);padding:18px;display:flex;flex-direction:column;gap:14px;clip-path:var(--card)}
.empty{border:1.5px dashed var(--line);padding:20px;text-align:left;display:flex;flex-direction:column;gap:10px;color:var(--muted)}
.empty strong{color:var(--ink);font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase}

/* live workout */
.wbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,66px));z-index:5;background:var(--bg);padding-block:12px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);margin-bottom:14px}
.title-input{width:100%;border:0;background:transparent;font-family:var(--display);font-style:italic;font-weight:900;font-size:36px;line-height:1.05;text-transform:uppercase;padding:0;min-width:0;color:var(--ink)}
.title-input::placeholder{color:var(--muted)}
.title-input:focus{outline:none;box-shadow:inset 0 -3px 0 var(--accent)}
.clocks{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.clock{display:flex;gap:8px;align-items:baseline}
.clock .num{font-size:28px;line-height:1}
.clock.rest{background:var(--accent);color:var(--accent-ink);padding:3px 16px;clip-path:var(--cut)}
.clock.rest .eyebrow{color:var(--accent-ink)}
.clock.rest .num{color:var(--accent-ink)}

.ex{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;clip-path:var(--card)}
.ex-head{display:flex;gap:8px;align-items:center}
.ex-num{font-family:var(--display);font-style:italic;font-weight:900;font-size:24px;color:var(--pink);min-width:22px}
.ex-name{flex:1;min-width:0;border:0;border-bottom:1.5px solid var(--line);background:transparent;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;text-transform:uppercase;padding:4px 0;border-radius:0;color:var(--ink)}
.ex-name::placeholder{color:var(--muted);text-transform:none;font-weight:600}
.ex-name:focus{border-bottom-color:var(--accent);outline:none}
.kind{-webkit-appearance:none;appearance:none;border:0;border-radius:0;background-color:var(--accent);background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0h10L5 6z%27 fill=%27%23141414%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 14px center;color:var(--accent-ink);font-size:15px;font-weight:600;line-height:1.2;padding:7px 28px 7px 14px;max-width:150px;margin-right:14px;clip-path:var(--cut)}
.hint{font-size:13px;color:var(--muted);margin:0}
.hint b{font-weight:600;color:var(--ink)}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:24px 1fr 1fr 40px 48px 28px;gap:6px;align-items:center}
.set.k-r,.set.k-t{grid-template-columns:24px 1fr 48px 28px}
.plan .set{grid-template-columns:24px 1fr 1fr 40px 28px}
.plan .set.k-r,.plan .set.k-t{grid-template-columns:24px 1fr 28px}
.set.k-c{grid-template-columns:1fr 1fr 48px}
.plan .set.k-c{grid-template-columns:1fr 1fr}
.add-row>.btn{flex:1;white-space:nowrap;padding-left:8px;padding-right:8px}
.setgrp{display:flex;flex-direction:column;gap:4px}
.set.drop input{min-height:40px;font-size:20px;box-shadow:inset 0 -3px 0 var(--pink)}
.set.drop .n{color:var(--pink);font-size:18px;font-weight:900}
.drop-btn{min-height:46px;border:0;background:#262626;display:grid;place-items:center;padding:0;clip-path:var(--cut)}
.drop-btn svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.drop-btn:hover svg{stroke:var(--pink)}
.drop-btn.has{background:rgba(255,46,147,.16)}
.drop-btn.has svg{stroke:var(--pink)}
.set.head{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700}
.set .n{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;color:var(--muted);text-align:center}
.set input{width:100%;min-width:0;min-height:48px;border:0;background:var(--sunk);color:var(--ink);text-align:center;font-family:var(--display);font-style:italic;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 6px;clip-path:var(--cut)}
.set input::placeholder{color:var(--muted);opacity:.6;font-weight:600}
.set input:focus{outline:none;box-shadow:inset 0 -3px 0 var(--accent);background:#353535}
.chk{min-height:48px;border:0;background:#333;display:grid;place-items:center;padding:0;clip-path:var(--cut)}
.chk svg{width:22px;height:22px;stroke:#8A8A8A;fill:none;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.set.is-done input{background:var(--done-bg);color:#C4C4C4}
.set.is-done .chk{background:var(--done)}
.set.is-done .chk svg{stroke:var(--pink-ink)}
.x{min-height:32px;border:0;background:transparent;color:var(--muted);font-size:20px;line-height:1;padding:0}
.x:hover{color:var(--warn);background:var(--warn-bg)}
.ex-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:space-between;align-items:center}
.ex-actions>.btn:first-child{background:var(--accent);color:var(--accent-ink)}

.finish{background:var(--surface);box-shadow:inset 0 0 0 2px var(--pink);padding:16px;display:flex;flex-direction:column;gap:12px;clip-path:var(--card)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--pink);flex:none}
.field{width:100%;min-height:46px;border:0;background:var(--sunk);color:var(--ink);padding:0 12px}
.field:focus{outline:none;box-shadow:inset 0 -3px 0 var(--accent)}
textarea.field{padding:10px 12px;min-height:70px;resize:vertical}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);padding:10px 12px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,0 100%)}
.stat .num{font-size:34px;display:block;line-height:1.05;color:var(--accent)}
.stat span:last-child{font-size:12px;color:var(--muted)}

details.hist summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary .chev{transition:transform .15s;color:var(--pink);font-size:14px;margin-top:4px}
details.hist[open] summary .chev{transform:rotate(90deg)}
.detail{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:10px;border-top:1px solid var(--line)}
.detail .dex{display:flex;flex-direction:column;gap:2px}
.detail .dsets{font-family:var(--display);font-style:italic;font-weight:700;font-size:18px;color:var(--muted)}
.cal{background:var(--surface);padding:14px;margin-top:12px;clip-path:var(--card)}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.cal-head h3{text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center;font-weight:700;padding-block:2px 4px}
.day{min-height:40px;border:0;background:transparent;font-family:var(--display);font-style:italic;font-size:19px;font-weight:700;color:var(--ink);display:grid;place-items:center;padding:0;cursor:default;position:relative}
.day.today{box-shadow:inset 0 -3px 0 var(--pink);color:var(--pink)}
.day.has-w{background:var(--accent);color:var(--accent-ink);font-weight:900;cursor:pointer;clip-path:var(--cut)}
.day.has-w.today{background:var(--pink);color:var(--pink-ink);box-shadow:none}
.day .cnt{position:absolute;top:3px;right:8px;font-size:11px;line-height:1}
.day.out{visibility:hidden}
.plan-w{display:flex;align-items:baseline;gap:6px;flex:0 0 auto}
.plan-w span{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.plan{width:84px;min-height:32px;border:0;border-bottom:1.5px dashed #444;background:transparent;color:var(--ink);font-family:var(--display);font-style:italic;font-weight:700;font-size:17px;padding:2px 2px;border-radius:0}
.plan::placeholder{color:var(--muted);font-family:var(--body);font-style:normal;font-weight:500;font-size:12px}
.plan:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.dex-top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dplan{font-size:12px;color:var(--muted);white-space:nowrap}
.ex-tools{gap:2px;flex-wrap:nowrap}
.ib{width:38px;height:38px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;padding:0;cursor:pointer}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.on{color:var(--pink)}
.ib:disabled{opacity:.3}
.ex-note{width:100%;min-height:36px;border:0;border-bottom:1.5px dashed #444;background:transparent;color:var(--ink);font-size:14px;font-style:italic;padding:4px 0;border-radius:0}
.ex-note:focus{outline:none;border-bottom:1.5px solid var(--accent)}
.ss-grp{position:relative;display:flex;flex-direction:column;gap:6px;padding-left:12px;margin-bottom:14px;border-left:4px solid var(--pink)}
.ss-grp>.ex{margin-bottom:0}
.ss-lbl{font-family:var(--display);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
.detail .ss-grp{gap:8px;margin-bottom:0;padding-left:10px;border-left-width:3px}
.dnote,.snote{font-size:13px;font-style:italic;color:var(--muted)}
.snote{padding-top:4px}
.tpl-note{font-size:13px;color:var(--muted);margin:0 0 12px}
.tpl-note b{color:var(--ink);font-weight:600}
.wnote{display:flex;flex-direction:column;gap:6px;margin-top:16px}
.wnote textarea{min-height:64px;padding:10px 12px;resize:vertical;font:inherit}
details.hist.flash{box-shadow:inset 0 0 0 2px var(--accent)}
.streak{display:flex;align-items:baseline;gap:12px}
.streak-n{font-family:var(--display);font-style:italic;font-weight:900;font-size:64px;line-height:.9;color:var(--accent)}
.streak-t{font-family:var(--display);font-style:italic;font-weight:800;font-size:20px;text-transform:uppercase}
.wk{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.wk-dots{display:flex;gap:4px}
.wk-dots span{width:22px;height:10px;background:var(--sunk);clip-path:polygon(3px 0,100% 0,calc(100% - 3px) 100%,0 100%)}
.wk-dots span.on{background:var(--pink)}
.goal{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper .btn{min-width:44px;font-size:24px;font-style:normal;padding:0}
.stepper b{font-family:var(--display);font-style:italic;font-size:24px;min-width:24px;text-align:center}
.wk-title{font-size:18px}
.mbars{display:flex;flex-direction:column;gap:8px}
.mbar{display:grid;grid-template-columns:84px 1fr 32px;gap:10px;align-items:center}
.mlab{font-size:13px;color:var(--ink)}
.mbar.zero .mlab,.mbar.zero .mval{color:var(--muted)}
.mtrack{height:14px;background:var(--surface)}
.mfill{display:block;height:100%;background:var(--accent);clip-path:polygon(0 0,100% 0,calc(100% - 4px) 100%,0 100%)}
.mval{font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;text-align:right}
.ex-filter{min-height:42px}
.prog-title{margin-bottom:12px}
.ex-pick{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.ex-pick select,.msel select{-webkit-appearance:none;appearance:none;border-radius:0;font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;text-transform:uppercase;padding-right:36px;background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2712%27 height=%277%27%3E%3Cpath d=%27M0 0h12L6 7z%27 fill=%27%23FFE11A%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center}
.msel select{font-size:15px;font-family:var(--body);font-style:normal;font-weight:500;text-transform:none}
.seg-body .msel{flex-direction:row;align-items:center;gap:10px;max-width:none;margin:10px 0}
.seg-body .msel select{min-height:38px;flex:1}
.seg-body .chart-box{margin-top:14px}
.streak-box{gap:10px}
.sum-ex{grid-template-columns:1.5fr 1fr 1fr}
.sum-ex .sum-n{font-size:21px}
.sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.sum-t{border:0;background:var(--surface);color:var(--ink);padding:8px 10px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.sum-n{font-family:var(--display);font-style:italic;font-weight:900;font-size:26px;line-height:1;color:var(--accent);white-space:nowrap}
.sum-n small{font-size:16px;color:var(--muted)}
.sum-l{font-size:11px;color:var(--muted);line-height:1.2}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-top:14px;border-bottom:1px solid #2A2A2A}
.seg button{border:0;background:transparent;color:var(--muted);min-height:42px;font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;text-transform:uppercase;letter-spacing:.03em;cursor:pointer;box-shadow:inset 0 -3px 0 transparent}
.seg button[aria-selected="true"]{color:var(--ink);box-shadow:inset 0 -3px 0 var(--pink)}
.seg-body>.section:first-child{margin-top:14px}
.seg-body h2{font-size:20px}
.seg-body .prog-list>h2,.seg-body .prog-list>.meta:first-of-type{display:none}
.ex-rows{display:flex;flex-direction:column;gap:2px}
.ex-row{display:grid;grid-template-columns:1fr auto 14px;gap:10px;align-items:center;min-height:46px;border:0;background:var(--surface);color:var(--ink);padding:6px 12px;text-align:left;cursor:pointer}
.ex-row[hidden]{display:none}
.er-name{font-family:var(--display);font-style:italic;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.er-best{font-size:12px;color:var(--muted);white-space:nowrap}
.er-go{color:var(--pink);font-weight:700}
.ex-more{align-self:flex-start}
.chip.sm{padding:7px 14px}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.msel{display:flex;flex-direction:column;gap:6px;margin-bottom:14px;max-width:260px}
.msel select{-webkit-appearance:none;appearance:none;border-radius:0}
.body-add summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.body-add summary::-webkit-details-marker{display:none}
.body-add summary .chev{color:var(--pink);font-size:14px;transition:transform .15s}
.body-add[open] summary .chev{transform:rotate(90deg)}
.body-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.body-form .bf{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.body-form .bf:first-child{grid-column:1/-1}
.body-form .btn{grid-column:1/-1}
.body-form input[type=date]{-webkit-appearance:none;appearance:none;border-radius:0;color-scheme:dark}
.body-stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.body-row{position:relative;padding-right:44px}
.body-row .body-x{position:absolute;right:0;top:0;min-height:40px;min-width:40px;padding:0;font-size:24px;font-style:normal}
.body-row .row{margin-top:4px}
.pr-line{margin:0;font-size:13px;font-weight:700;color:var(--pink)}
.set .n.pr{font-style:normal;font-size:17px}
.pr-n{color:var(--accent);font-weight:700}
.dex-name{border:0;background:transparent;padding:0;color:inherit;font:inherit;text-align:left;cursor:pointer;text-decoration:underline;text-decoration-color:#555;text-underline-offset:3px}
.dex-name span{color:var(--accent)}
.prog-list{margin-top:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border:0;background:var(--surface);color:var(--ink);padding:9px 16px 9px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;cursor:pointer;clip-path:var(--cut)}
.chip-name{font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;text-transform:uppercase;letter-spacing:.02em}
.chip-best{font-size:12px;color:var(--muted)}
.back{margin:0 0 6px -10px}
.prog-h{margin:0 0 12px;text-transform:uppercase}
.prog-stats{grid-template-columns:repeat(2,minmax(0,1fr))}.prog-stats .stat:first-child{grid-column:1/-1}
.stat .num.sm{font-size:26px}
.chart-box{margin-top:16px}
.chart-box h2,.prog-log h2{font-size:20px}
.chart{display:block;width:100%;height:auto;margin-top:8px;overflow:visible}
.chart .g{stroke:#2E2E2E;stroke-width:1}
.chart .yl,.chart .xl{fill:var(--muted);font:500 11px Inter,sans-serif}
.chart .yl{text-anchor:end}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .dot{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.chart .is-pr .dot{fill:var(--pink);r:6}
.chart .hit{fill:transparent;cursor:pointer}
.chart .pt:focus-visible .dot{stroke:var(--ink)}
.legend{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:6px}
.lg-dot{width:10px;height:10px;border-radius:50%;background:var(--pink)}
.tip{position:fixed;z-index:30;background:linear-gradient(315deg,transparent 13px,var(--accent) 13px);color:var(--accent-ink);padding:10px 22px 14px 14px;font-size:13px;line-height:1.35;max-width:240px;pointer-events:none;transform:rotate(-1.5deg);filter:drop-shadow(0 8px 12px rgba(0,0,0,.6)) drop-shadow(0 2px 3px rgba(0,0,0,.4))}
.tip::after{content:"";position:absolute;right:0;bottom:0;width:18px;height:18px;background:linear-gradient(135deg,#C7AE00 50%,transparent 50%)}
.tip .td{font-size:11px;text-transform:uppercase;letter-spacing:.08em;opacity:.75;margin-bottom:2px;font-weight:700}
.tip div+div{margin-top:2px}
.month{font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:8px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid #2A2A2A;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
nav.tabs button{min-height:50px;border:0;background:transparent;font-family:var(--display);font-style:italic;font-size:19px;font-weight:800;text-transform:uppercase;color:#E0E0E0;letter-spacing:.02em;white-space:nowrap;padding:0 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;clip-path:var(--cut-lg)}
nav.tabs button[aria-current="true"]{color:var(--accent-ink);background:var(--accent)}
nav.tabs .dot{width:6px;height:6px;border-radius:50%;background:var(--pink)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--accent);color:var(--accent-ink);font-weight:600;padding:10px 18px;font-size:14px;z-index:20;max-width:calc(100% - 32px);text-align:center;clip-path:var(--cut)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.backup{margin-top:28px}
.backup .meta{font-size:13px;color:var(--muted)}
.top-r{display:flex;gap:10px;align-items:center;position:relative;z-index:1}
.lang{-webkit-appearance:none;appearance:none;border:0;border-radius:0;min-height:32px;padding:0 26px 0 14px;background-color:var(--accent);background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%2710%27 height=%276%27%3E%3Cpath d=%27M0 0h10L5 6z%27 fill=%27%23141414%27/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;color:var(--accent-ink);font-family:var(--display);font-style:italic;font-weight:800;font-size:16px;letter-spacing:.04em;clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%)}
@media (max-width:480px){.ex-head{flex-wrap:wrap}.ex-name{flex:1 1 calc(100% - 40px)}.kind{margin-left:30px}.title-input{font-size:32px}nav.tabs button{font-size:12px;letter-spacing:0;padding:0 2px;clip-path:none}nav.tabs button[aria-current="true"]{clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}.add-row>.btn{font-size:16px}}
</style>
</head>

const store={mode:"local",subs:{},
  async init(){try{navigator.storage&&navigator.storage.persist&&await navigator.storage.persist()}catch(e){}},
  subscribe(coll,cb){this.subs[coll]=cb;cb(Object.values(LS.get("podhod:"+coll,{})),false)},

/* ---------- backup to a file ---------- */
async function saveFile(text,name,type){
  const blob=new Blob([text],{type});
  try{
    const file=new File([blob],name,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return "shared"}
  }catch(e){if(e&&e.name==="AbortError")return false}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);return "downloaded";
}

/* Workout log as CSV: one row per set (drops get their own rows), comma-separated, UTF-8 */
function sessionsCsv(){
  const KIND={wr:"weight_reps",r:"reps",t:"time",c:"cardio"};
  const q=v=>{v=v==null?"":String(v);return /[",\r\n]/.test(v)?"\""+v.replace(/"/g,"\"\"")+"\"":v};
  const n=v=>{v=String(v==null?"":v).trim().replace(",",".");return v===""?"":v};
  const p2=x=>String(x).padStart(2,"0");
  const rows=[["date","time","duration_min","workout","exercise","type","set","drop","weight_kg","reps","seconds","minutes","distance_km","plan","exercise_note","workout_note"]];
  [...sessions].sort((a,b)=>a.finishedAt-b.finishedAt).forEach(ses=>{
    const st=new Date(ses.startedAt||ses.finishedAt),date=st.getFullYear()+"-"+p2(st.getMonth()+1)+"-"+p2(st.getDate()),time=ses.startedAt?p2(st.getHours())+":"+p2(st.getMinutes()):"";
    const dur=ses.startedAt?Math.round((ses.finishedAt-ses.startedAt)/60000):"";
    (ses.exercises||[]).forEach(ex=>{const k=ex.kind||"wr";
      (ex.sets||[]).forEach((st2,i)=>{
        const base=[date,time,dur,ses.name||"",ex.name||"",KIND[k]||k,i+1],pl=ex.plan||"",nt=[ex.note||"",ses.note||""];
        if(k==="c")rows.push([...base,"","","","",n(st2.r),n(st2.w),pl,...nt]);
        else if(k==="t")rows.push([...base,"","","",n(st2.r),"","",pl,...nt]);
        else if(k==="r")rows.push([...base,"","",n(st2.r),"","","",pl,...nt]);
        else{rows.push([...base,"",n(st2.w),n(st2.r),"","","",pl,...nt]);
          (st2.drops||[]).forEach((d,j)=>rows.push([...base,j+1,n(d.w),n(d.r),"","","",pl,...nt]))}
      })})
  });
  return "﻿"+rows.map(r=>r.map(q).join(",")).join("\r\n")+"\r\n";
}

/* ---------- derived ---------- */
function lastFor(name,beforeTs){
  const n=norm(name);if(!n) return null;
  for(const s of sessions){ if(beforeTs&&s.finishedAt>=beforeTs) continue;
    const ex=(s.exercises||[]).find(e=>norm(e.name)===n); if(ex) return {date:s.finishedAt,ex};}
  return null;
}
function cardioText(s){
  const L=T(),p=[];
  if(num(s.r))p.push(fmt(s.r)+" "+L.min);
  if(num(s.w))p.push(fmt(s.w)+" "+L.km);
  return p.join(" · ");
}
function setText(ex,s){
  if(ex.kind==="c") return cardioText(s);
  if(ex.kind==="t") return fmt(s.r)+" "+T().secShort;
  if(ex.kind==="r") return fmt(s.r);
  return [s,...(s.drops||[])].map(x=>(num(x.w)?fmt(x.w)+T().kg+" × ":"")+fmt(x.r)).join(" → ");
}
function summarize(ex){
  const sets=ex.sets||[];const n=sets.length;if(!n) return "";
  if(ex.kind==="c") return cardioText(sets[0])||T().kinds.c;
  const reps=[...new Set(sets.map(s=>fmt(s.r)))];
  let out=reps.length===1&&num(reps[0])?n+"×"+reps[0]+(ex.kind==="t"?" "+T().secShort:""):n+" "+pl(n,"set");
  const mw=Math.max(...sets.map(s=>num(s.w)));
  if(ex.kind==="wr"&&mw>0) out+=" · "+fmt(mw)+" "+T().kg;
  if(ex.kind==="wr"&&sets.some(s=>s.drops&&s.drops.length)) out+=" · "+T().drop;
  return out;
}

/* ---------- records ---------- */
const exKey=ex=>norm(ex.name)+"|"+(ex.kind||"wr");
// Comparable score of a set: [primary, secondary], or null when the set can't count
function setScore(kind,st){
  const w=num(st.w),r=num(st.r);
  if(kind==="c") return w>0||r>0?[w,r]:null;       // cardio: distance first, then minutes
  if(kind==="r"||kind==="t") return r>0?[r,0]:null; // reps / seconds
  return w>0&&r>0?[w,r]:null;                       // weight first, then reps at that weight
}
const better=(a,b)=>!b||a[0]>b[0]||(a[0]===b[0]&&a[1]>b[1]);
function scoreText(kind,sc){
  const L=T();
  if(kind==="c") return sc[0]>0?fmt(sc[0])+" "+L.km:fmt(sc[1])+" "+L.min;
  if(kind==="t") return fmt(sc[0])+" "+L.secShort;
  if(kind==="r") return fmt(sc[0])+" "+L.reps;
  return fmt(sc[0])+" "+L.kg+" × "+fmt(sc[1]);
}
// Walk all saved workouts oldest→newest. A set is a record when it beats every earlier set of the
// same exercise; the first time an exercise is done sets the baseline and is not a record.
let prCache=null;
function prIndex(){
  if(prCache&&prCache.src===sessions) return prCache;
  const best={},marks=new Set(),bySes={};
  [...sessions].sort((a,b)=>a.finishedAt-b.finishedAt).forEach(ses=>{
    (ses.exercises||[]).forEach((ex,ei)=>{
      const k=ex.kind||"wr",key=exKey(ex);if(!norm(ex.name))return;
      let run=best[key];const hadBase=!!run;
      (ex.sets||[]).forEach((st,si)=>{const sc=setScore(k,st);if(!sc)return;
        if(better(sc,run)){if(hadBase){marks.add(ses.id+":"+ei+":"+si);bySes[ses.id]=(bySes[ses.id]||0)+1}run=sc}});
      if(run)best[key]=run;
    });
  });
  return prCache={src:sessions,best,marks,bySes};
}
// Records in the running workout: done sets that beat history (and earlier done sets of this workout)
function livePr(ex){
  const k=ex.kind||"wr",base=prIndex().best[exKey(ex)],out=new Set();let run=base,top=null;
  if(!base||!norm(ex.name)) return {sets:out,top};
  (ex.sets||[]).forEach((st,si)=>{if(!st.done)return;const sc=setScore(k,st);if(sc&&better(sc,run)){out.add(si);run=sc;top=sc}});
  return {sets:out,top};
}
// All saved workouts containing the exercise, oldest first, with the session's best score
function exHistory(key){
  const out=[];
  [...sessions].sort((a,b)=>a.finishedAt-b.finishedAt).forEach(ses=>(ses.exercises||[]).forEach((ex,ei)=>{
    if(exKey(ex)!==key)return;const k=ex.kind||"wr";let top=null,pr=false;
    (ex.sets||[]).forEach((st,si)=>{const sc=setScore(k,st);if(sc&&better(sc,top))top=sc;if(prIndex().marks.has(ses.id+":"+ei+":"+si))pr=true});
    out.push({ses,ex,ei,top,pr});
  }));
  return out;
}
function exerciseList(){
  const seen=new Map();
  [...sessions].sort((a,b)=>b.finishedAt-a.finishedAt).forEach(ses=>(ses.exercises||[]).forEach(ex=>{
    if(!norm(ex.name))return;const key=exKey(ex);
    if(!seen.has(key))seen.set(key,{key,name:ex.name.trim(),kind:ex.kind||"wr",count:0});seen.get(key).count++;
  }));
  return [...seen.values()];
}

/* ---------- weeks, streak ---------- */
const weekStart=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()};
const addWeeks=(ws,n)=>{const d=new Date(ws);d.setDate(d.getDate()+7*n);return d.getTime()};
const weekGoal=()=>{const g=+LS.get("podhod:weekGoal",3);return g>=1&&g<=7?g:3};
function weekCounts(){const c={};sessions.forEach(s=>{const w=weekStart(s.finishedAt);c[w]=(c[w]||0)+1});return c}
// Weeks in a row that reached the goal. The current week only adds once reached; not reaching it yet doesn't break the streak.
function streak(){
  const c=weekCounts(),g=weekGoal(),now=weekStart(Date.now());let n=0;
  if((c[now]||0)>=g)n++;
  for(let w=addWeeks(now,-1);(c[w]||0)>=g;w=addWeeks(w,-1))n++;
  return {n,thisWeek:c[now]||0,goal:g};
}
const weekLabel=ws=>{const e=addWeeks(ws,1)-864e5;return dShort(ws)+" – "+dShort(e)};

  ["core",/пресс|скручив|планк|dead bug|pallof|crunch|plank|\babs?\b|sit-?up/],
  ["glutes",/ягод|мост|отведени|кикбек|махи с нижнего|разведени|hip thrust|glute|abduct|kickback/],
  ["legs",/присед|выпад|жим ног|разгибани|сгибани|икр|носк|румынск|станов|гак|сведени|leg|squat|lunge|calf|deadlift|step-?up/],

function guessMuscle(name){const n=norm(name);for(const [g,re] of MUSCLE_RULES)if(re.test(n))return g;return "other"}
function muscleOf(ex){
  if((ex.kind||"wr")==="c")return null;

function muscleSets(ws){
  const we=addWeeks(ws,1),out={};
  sessions.forEach(s=>{if(s.finishedAt<ws||s.finishedAt>=we)return;
    (s.exercises||[]).forEach(ex=>{const g=muscleOf(ex);if(!g||g==="stretch"||g==="other")return;out[g]=(out[g]||0)+(ex.sets||[]).length})});
  return out;
}

/* ---------- supersets: consecutive exercises with ss=true are joined to the next one ---------- */
function exGroups(exs,fn,label){
  let html="",i=0;
  while(i<exs.length){
    if(exs[i].ss&&i+1<exs.length){
      let j=i,inner="";
      while(j<exs.length){inner+=fn(exs[j],j);if(exs[j].ss&&j+1<exs.length)j++;else break}
      html+=`<div class="ss-grp"><div class="ss-lbl">${esc(label)}</div>${inner}</div>`;i=j+1;
    }else{html+=fn(exs[i],i);i++}
  }
  return html;
}

/* ---------- generic line chart (single series, time on x) ---------- */
// pts: [{t, v, tip, hi}] oldest first; hi = highlighted point (record)
function lineChart(pts,aria){
  const W=340,H=190,pl=38,pr=14,pt=14,pb=26;
  const t0=pts[0].t,t1=pts[pts.length-1].t,span=Math.max(1,t1-t0);
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(lo===hi){lo=lo*0.95;hi=hi*1.05||1}
  const pad=(hi-lo)*0.12;lo=Math.max(0,lo-pad);hi=hi+pad;
  const step=niceStep((hi-lo)/4),g0=Math.ceil(lo/step)*step,ticks=[];for(let v=g0;v<=hi+1e-9;v+=step)ticks.push(+v.toFixed(6));
  const x=t=>pl+(W-pl-pr)*(t-t0)/span,y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
  const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${pl-6}" y="${y(v)+4}" class="yl">${esc(fmt(v))}</text>`).join("");
  const line=pts.map((p,i)=>(i?"L":"M")+x(p.t).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
  const dots=pts.map(p=>{const cx=x(p.t).toFixed(1),cy=y(p.v).toFixed(1);
    return `<g class="pt${p.hi?" is-pr":""}" data-act="ptip" data-tip="${esc(p.tip)}"><circle cx="${cx}" cy="${cy}" r="16" class="hit"/><circle cx="${cx}" cy="${cy}" r="5" class="dot"/></g>`}).join("");
  const xl=`<text x="${pl}" y="${H-6}" class="xl" text-anchor="start">${esc(dShort(t0))}</text><text x="${W-pr}" y="${H-6}" class="xl" text-anchor="end">${esc(dShort(t1))}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${grid}<path d="${line}" class="ln"/>${dots}${xl}</svg>`;
}

function viewProgress(key,inline){
  const L=T(),hist=exHistory(key);
  if(!hist.length){ui.prog=null;return inline?"":viewProgressTab()}
  const last=hist[hist.length-1],kind=last.ex.kind||"wr",name=last.ex.name;
  const best=prIndex().best[key];
  // what the chart plots
  let metric=kind,val=h=>h.top?h.top[0]:null;
  if(kind==="c"){const anyKm=hist.some(h=>h.top&&h.top[0]>0);metric=anyKm?"km":"min";val=h=>h.top?(anyKm?h.top[0]:h.top[1]):null}
  const pts=hist.map(h=>({h,v:val(h)})).filter(p=>p.v>0);
  const title=L.progChart[metric];
  let chart="";
  if(pts.length<2) chart=`<p class="meta">${L.progOne}</p>`;
  else if(true){
    chart=lineChart(pts.map(p=>({t:p.h.ses.finishedAt,v:p.v,hi:p.h.pr,tip:dLong(p.h.ses.finishedAt)+"|"+p.h.ex.sets.map((st,si)=>setText(p.h.ex,st)+(prIndex().marks.has(p.h.ses.id+":"+p.h.ei+":"+si)?" 🏆":"")).join(" · ")})),L.aChart(title,pts.length))+(hist.some(h=>h.pr)?`<div class="legend"><span class="lg-dot"></span>${L.progLegend}</div>`:"");
  }
  else{
    const W=340,H=190,pl=34,pr=14,pt=14,pb=26;
    const t0=pts[0].h.ses.finishedAt,t1=pts[pts.length-1].h.ses.finishedAt,span=Math.max(1,t1-t0);
    let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
    if(lo===hi){lo=lo*0.9;hi=hi*1.1||1}
    const pad=(hi-lo)*0.12;lo=Math.max(0,lo-pad);hi=hi+pad;
    const step=niceStep((hi-lo)/4),g0=Math.ceil(lo/step)*step,ticks=[];for(let v=g0;v<=hi+1e-9;v+=step)ticks.push(+v.toFixed(6));
    const x=t=>pl+(W-pl-pr)*(t-t0)/span,y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo));
    const grid=ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" class="g"/><text x="${pl-6}" y="${y(v)+4}" class="yl">${esc(fmt(v))}</text>`).join("");
    const line=pts.map((p,i)=>(i?"L":"M")+x(p.h.ses.finishedAt).toFixed(1)+" "+y(p.v).toFixed(1)).join(" ");
    const dots=pts.map(p=>{const cx=x(p.h.ses.finishedAt).toFixed(1),cy=y(p.v).toFixed(1);
      const tip=dLong(p.h.ses.finishedAt)+"|"+p.h.ex.sets.map((st,si)=>setText(p.h.ex,st)+(prIndex().marks.has(p.h.ses.id+":"+p.h.ei+":"+si)?" 🏆":"")).join(" · ");
      return `<g class="pt${p.h.pr?" is-pr":""}" data-act="ptip" data-tip="${esc(tip)}"><circle cx="${cx}" cy="${cy}" r="16" class="hit"/><circle cx="${cx}" cy="${cy}" r="5" class="dot"/></g>`}).join("");
    const xl=`<text x="${pl}" y="${H-6}" class="xl" text-anchor="start">${esc(dShort(t0))}</text><text x="${W-pr}" y="${H-6}" class="xl" text-anchor="end">${esc(dShort(t1))}</text>`;
    chart=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(L.aChart(title,pts.length))}">${grid}<path d="${line}" class="ln"/>${dots}${xl}</svg>
      ${hist.some(h=>h.pr)?`<div class="legend"><span class="lg-dot"></span>${L.progLegend}</div>`:""}`;
  }
  const showAll=!inline||ui.logAll;
  const log=[...hist].reverse().slice(0,showAll?undefined:5).map(h=>`<div class="dex"><span>${esc(dLong(h.ses.finishedAt))}</span><span class="dsets">${h.ex.sets.map((st,si)=>esc(setText(h.ex,st))+(prIndex().marks.has(h.ses.id+":"+h.ei+":"+si)?" 🏆":"")).join(" · ")}</span></div>`).join("");
  return `${inline?"":`<button class="btn ghost small back" data-act="prog-close">${L.progBack}</button>
    <h1 class="prog-h">${esc(name)}</h1>`}
    ${kind!=="c"?`<label class="msel"><span class="eyebrow">${L.muscleLbl}</span><select class="field" id="muscle-sel" data-n="${esc(norm(name))}">${[...GROUPS,"stretch","other"].map(g=>`<option value="${g}"${muscleOf(last.ex)===g?" selected":""}>${esc(L.groups[g])}</option>`).join("")}</select></label>`:""}
    ${inline?`<div class="sum sum-ex"><div class="sum-t"><span class="sum-n">${best?esc(scoreText(kind,best)):"—"}</span><span class="sum-l">🏆 ${L.progBest}</span></div><div class="sum-t"><span class="sum-n">${hist.length}</span><span class="sum-l">${L.progSessions}</span></div><div class="sum-t"><span class="sum-n">${esc(dShort(last.ses.finishedAt))}</span><span class="sum-l">${L.progLast}</span></div></div>`:`<div class="stats prog-stats"><div class="stat"><span class="num">${best?esc(scoreText(kind,best)):"—"}</span><span>🏆 ${L.progBest}</span></div>
      <div class="stat"><span class="num">${hist.length}</span><span>${L.progSessions}</span></div>
      <div class="stat"><span class="num sm">${esc(dShort(last.ses.finishedAt))}</span><span>${L.progLast}</span></div></div>`}
    <div class="section chart-box"><h2>${esc(title)}</h2>${chart}</div>
    <div class="section prog-log"><h2>${L.progLog}</h2><div class="detail">${log}</div>${!showAll&&hist.length>5?`<button class="btn ghost small ex-more" data-act="log-all">${esc(L.exAll(hist.length))}</button>`:""}</div>`;
}
function niceStep(raw){const p=Math.pow(10,Math.floor(Math.log10(raw||1))),m=raw/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function viewCalendar(){
  const L=T(),y=cal.y,m=cal.m,first=new Date(y,m,1),off=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  const counts={};sessions.forEach(s=>{const k=dayKey(s.finishedAt);counts[k]=(counts[k]||0)+1});
  const todayK=dayKey(Date.now());
  let cells="";

  for(let i=0;i<off;i++)cells+=`<span class="day out" aria-hidden="true"></span>`;
  for(let d=1;d<=days;d++){
    const k=y+"-"+m+"-"+d,c=counts[k]||0,cls="day"+(c?" has-w":"")+(k===todayK?" today":"");
    cells+=c?`<button class="${cls}" data-act="day" data-key="${k}" aria-describedby="tip">${d}${c>1?`<span class="cnt">${c}</span>`:""}</button>`:`<span class="${cls}">${d}</span>`;

}

function setHdr(){const h=$(".top");if(h)document.documentElement.style.setProperty("--hdr",h.offsetHeight+"px")}
window.addEventListener("resize",setHdr);
function placeTip(el){
  const tip=$("#tip");tip.hidden=false;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;
  // keep clear of the screen edges (the note is slightly rotated) and of the bottom tab bar
  const M=16,nav=document.querySelector("nav.tabs"),bottom=(nav?nav.getBoundingClientRect().top:window.innerHeight)-M;
  let left=Math.min(Math.max(M,r.left+r.width/2-tw/2),window.innerWidth-tw-M);
  const hdr=$(".top").getBoundingClientRect().bottom;
  let top=r.top-th-10;
  if(top<hdr+M){top=r.bottom+10;if(top+th>bottom)top=Math.max(hdr+M,bottom-th)}
  tip.style.left=left+"px";tip.style.top=top+"px";
}
const hideTip=()=>{$("#tip").hidden=true};

async function finishSave(){

  let exs=active.exercises.map(e=>Object.assign({name:(e.name||"").trim()||L.exercise,kind:e.kind||"wr",plan:(e.plan||"").trim(),

function seed(){
  const now=Date.now();
  Promise.all(T().samples.map((s,i)=>store.put("templates",uid(),Object.assign(clone(s),{updatedAt:now-i}))))
    .then(()=>toast(T().samplesAdded)).catch(saveErr);
}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-act]");
  if(!el||(el.dataset.act!=="day"&&el.dataset.act!=="ptip"))hideTip();
  if(!el)return;
  const L=T();
  const a=el.dataset.act,id=el.dataset.id;
  const obj=scopeObj(el);
  const exEl=el.closest("[data-ei]"),ei=exEl?+exEl.dataset.ei:-1;
  const ex=obj&&ei>=0?obj.exercises[ei]:null;
  const siEl=el.closest("[data-si]"),si=siEl?+siEl.dataset.si:-1;
  switch(a){
    case "tab": ui.prog=null;tab=el.dataset.tab;LS.set("podhod:tab",tab);ui.confirm=null;render();window.scrollTo(0,0);return;
    case "start-empty": return startWorkout(L.workout,null,null);
    case "start-cardio": return startWorkout(L.cardioW,[{name:L.cardioName,kind:"c",sets:[{w:"",r:""}]}],null);
    case "add-cardio":{obj.exercises.push({name:"",kind:"c",sets:[{w:"",r:"",done:false}]});touched(el);render();const ins=document.querySelectorAll(".ex-name");ins[ins.length-1]&&ins[ins.length-1].focus();return}
    case "start-tpl":{const t=templates.find(t=>t.id===id);if(t)startWorkout(t.name,clone(t.exercises||[]),t.id);return}
    case "repeat":{const s=sessions.find(s=>s.id===id);if(s)startWorkout(s.name,clone(s.exercises||[]),s.templateId&&templates.some(t=>t.id===s.templateId)?s.templateId:null);return}
    case "add-ex":{obj.exercises.push({name:"",kind:"wr",sets:[{w:"",r:"",done:false}]});touched(el);render();const ins=document.querySelectorAll(".ex-name");ins[ins.length-1]&&ins[ins.length-1].focus();return}
    case "del-ex": obj.exercises.splice(ei,1);touched(el);render();return;
    case "move-ex":{const j=ei+(+el.dataset.d);if(j<0||j>=obj.exercises.length)return;const t=obj.exercises[ei];obj.exercises[ei]=obj.exercises[j];obj.exercises[j]=t;touched(el);render();return}
    case "add-set": ex.sets.push({w:"",r:"",done:false});touched(el);render();return;
    case "add-drop":{const s=ex.sets[si];s.drops=s.drops||[];s.drops.push({w:"",r:""});touched(el);render();
      const inp=document.querySelector(`[data-ei="${ei}"] [data-si="${si}"] [data-di="${s.drops.length-1}"] input`);inp&&inp.focus();return}
    case "del-drop":{const di=+el.closest("[data-di]").dataset.di;ex.sets[si].drops.splice(di,1);touched(el);render();return}
    case "del-set": ex.sets.splice(si,1);touched(el);render();return;
    case "toggle-set":{
      const s=ex.sets[si];
      if(!s.done){s.done=true;active.restFrom=Date.now();if(livePr(ex).sets.has(si))setTimeout(()=>toast(T().newPr),0)}
      else s.done=false;
      saveActiveSoon();render();return}
    case "finish-open": ui.finishing=true;ui.keepTpl=false;ui.newTpl=false;ui.newTplName=active.name;render();return;
    case "finish-cancel": ui.finishing=false;render();return;
    case "finish-save": finishSave();return;
    case "discard-ask": ui.confirm="discard";render();return;
    case "discard-yes": active=null;ui.confirm=null;ui.finishing=false;flushActive();try{wake&&wake.release()}catch(e){}wake=null;render();toast(L.cancelled);return;
    case "confirm-no": ui.confirm=null;render();return;
    case "tpl-new": editing={id:uid(),isNew:true,data:{name:"",note:"",exercises:[{name:"",kind:"wr",sets:[{w:"",r:""},{w:"",r:""},{w:"",r:""}]}]}};tab="templates";render();window.scrollTo(0,0);return;
    case "tpl-edit":{const t=templates.find(t=>t.id===id);if(!t)return;editing={id:t.id,isNew:false,data:clone({name:t.name,note:t.note||"",exercises:t.exercises||[]})};render();window.scrollTo(0,0);return}
    case "tpl-copy":{const t=templates.find(t=>t.id===id);if(!t)return;store.put("templates",uid(),{name:t.name+L.copySuffix,note:t.note||"",exercises:clone(t.exercises||[]),updatedAt:Date.now()}).then(()=>toast(L.copyMade)).catch(saveErr);return}
    case "tpl-del-ask": ui.confirm="tpl:"+id;render();return;
    case "tpl-del-yes": ui.confirm=null;store.remove("templates",id).then(()=>toast(L.tplDeleted)).catch(saveErr);return;
    case "edit-save":{
      const d=editing.data;if(!d.name.trim()){toast(L.nameTpl);const ti=document.querySelector("[data-scope='edit'] .title-input");ti&&ti.focus();return}
      const body={name:d.name.trim(),note:(d.note||"").trim(),exercises:planFrom(d.exercises.filter(e=>(e.name||"").trim()||e.sets.length).map(e=>Object.assign({},e,{name:(e.name||"").trim()||L.exercise}))),updatedAt:Date.now()};
      store.put("templates",editing.id,body).then(()=>{editing=null;render();toast(L.tplSaved)}).catch(saveErr);return}
    case "edit-cancel": editing=null;render();return;
    case "ses-del-ask": ui.confirm="ses:"+id;render();return;
    case "ses-del-yes": ui.confirm=null;store.remove("sessions",id).then(()=>toast(L.delFromHist)).catch(saveErr);return;
    case "ses-to-tpl":{const s=sessions.find(s=>s.id===id);if(!s)return;editing={id:uid(),isNew:true,data:{name:s.name||"",note:"",exercises:planFrom(s.exercises||[])}};tab="templates";LS.set("podhod:tab",tab);render();window.scrollTo(0,0);return}
    case "seed": seed();return;
    case "day":{const ids=sessions.filter(s=>dayKey(s.finishedAt)===el.dataset.key).map(s=>s.id);if(!ids.length)return;
      ids.forEach(i=>openDetails.add(i));render();const c=document.querySelector(`details.hist[data-sid="${CSS.escape(ids[ids.length-1])}"]`);
      if(c){const y=c.getBoundingClientRect().top+window.scrollY-$(".top").offsetHeight-16;window.scrollTo({top:y,behavior:"smooth"});c.classList.add("flash");setTimeout(()=>c.classList.remove("flash"),1600)}return}
    case "backup-export": exportData();return;
    case "export-csv": exportCsv();return;
    case "prog": ui.prog=null;ui.progEx=el.dataset.key;ui.progSeg="ex";ui.logAll=false;tab="progress";LS.set("podhod:tab",tab);render();window.scrollTo(0,0);return;
    case "note-toggle": if(ex.note==null){ex.note="";touched(el);render();const n=document.querySelector(`[data-ei="${ei}"] .ex-note`);n&&n.focus()}else if(!String(ex.note).trim()){delete ex.note;touched(el);render()}else{const n=document.querySelector(`[data-ei="${ei}"] .ex-note`);n&&n.focus()}return;
    case "ss-toggle": if(ex.ss)delete ex.ss;else ex.ss=true;touched(el);render();return;
    case "log-all": ui.logAll=true;render();return;
    case "seg": ui.progSeg=el.dataset.s;LS.set("podhod:progSeg",ui.progSeg);render();return;
    case "ex-all": ui.exAll=true;render();return;
    case "goal":{const g=Math.min(7,Math.max(1,weekGoal()+(+el.dataset.d)));LS.set("podhod:weekGoal",g);render();return}
    case "mweek":{const cur=weekStart(Date.now());const base=ui.mWeek||(Object.keys(muscleSets(cur)).length?cur:addWeeks(cur,-1));ui.mWeek=Math.min(cur,addWeeks(base,+el.dataset.d));render();return}
    case "body-save": bodySave();return;
    case "body-metric": ui.bodyM=el.dataset.m;render();return;
    case "body-del-ask": ui.confirm="body:"+id;render();return;
    case "body-del-yes": ui.confirm=null;store.remove("body",id).then(()=>toast(L.bodyDeleted)).catch(saveErr);return;
    case "prog-close": ui.prog=null;render();window.scrollTo(0,0);return;
    case "ptip": showPointTip(el);return;
    case "backup-import": $("#import-file").click();return;
    case "hide-install": LS.set("podhod:hideInstall",true);render();return;
    case "cal":{cal.m+=+el.dataset.d;if(cal.m<0){cal.m=11;cal.y--}if(cal.m>11){cal.m=0;cal.y++}render();return}
  }
});
$("#lang").addEventListener("change",e=>{const v=e.target.value==="ru"?"ru":"en";if(v!==lang){lang=v;LS.set("podhod:lang",lang);refreshDatalist();render()}});
$("#import-file").addEventListener("change",e=>{const f=e.target.files&&e.target.files[0];if(f)importData(f);e.target.value=""});
document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="import-file")return;
  if(el.id==="ex-filter"){ui.exFilter=el.value;document.querySelectorAll(".prog-list .ex-row").forEach(c=>c.hidden=exRowHidden(c.dataset.n,+c.dataset.i));const m=$(".ex-more");if(m)m.hidden=!!norm(el.value);return}
  if(el.id&&el.id.startsWith("body-"))return;
  if(el.id==="opt-new"){ui.newTpl=el.checked;$("#opt-name").hidden=!el.checked;return}
  if(el.id==="opt-keep"){ui.keepTpl=el.checked;return}
  if(el.id==="opt-name"){ui.newTplName=el.value;return}
  const f=el.dataset.f;if(!f)return;
  const obj=scopeObj(el);if(!obj)return;
  if(f==="title")obj.name=el.value;
  else if(f==="note")obj.note=el.value;
  else{
    const ex=obj.exercises[+el.closest("[data-ei]").dataset.ei];
    if(f==="name")ex.name=el.value;
    else if(f==="plan")ex.plan=el.value;
    else if(f==="exnote")ex.note=el.value;
    else if(f==="kind"){ex.kind=el.value;
      if(ex.kind==="c"){const s0=ex.sets[0]||{w:"",r:""};ex.sets=[{w:s0.w,r:s0.r,done:!!s0.done}]}
      else if(!ex.sets.length)ex.sets.push({w:"",r:"",done:false});
      touched(el);render();return}
    else{const s=ex.sets[+el.closest("[data-si]").dataset.si];const dEl=el.closest("[data-di]");(dEl?s.drops[+dEl.dataset.di]:s)[f]=el.value.replace(",",".")}
  }
  touched(el);
});
document.addEventListener("change",e=>{
  const el=e.target;
  if(el.id==="ex-pick"){ui.progEx=el.value;ui.logAll=false;LS.set("podhod:progEx",ui.progEx);render();return}
  if(el.id==="muscle-sel"){const m=LS.get("podhod:muscles",{});if(guessMuscle(el.dataset.n)===el.value)delete m[el.dataset.n];else m[el.dataset.n]=el.value;LS.set("podhod:muscles",m);render();return}
  if(el.dataset.f!=="name")return;
  const obj=scopeObj(el),exEl=el.closest("[data-ei]"),ex=obj&&exEl&&obj.exercises[+exEl.dataset.ei];
  if(ex){const lp=lastFor(el.value);let changed=false;
    if(lp&&!(ex.plan||"").trim()&&lp.ex.plan){ex.plan=lp.ex.plan;const pi=exEl.querySelector("[data-f='plan']");if(pi)pi.value=ex.plan;touched(el)}
    if(lp&&ex.note==null&&lp.ex.note){ex.note=lp.ex.note;touched(el);render();return}}
  if(ex&&ex.kind!=="c"&&T().cardio.some(n=>norm(n)===norm(el.value))&&ex.sets.every(s=>String(s.w).trim()===""&&String(s.r).trim()==="")){
    ex.kind="c";ex.sets=[{w:"",r:"",done:false}];touched(el);render();return}
  const s=el.closest("[data-scope='active']");if(!s)return;
  const h=el.closest("[data-ei]").querySelector("[data-hint]");if(h)h.innerHTML=hintHtml(lastFor(el.value,active&&active.startedAt));
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||!e.target.matches(".set input"))return;
  e.preventDefault();const all=[...document.querySelectorAll(".set input")];const i=all.indexOf(e.target);(all[i+1]||e.target).focus();
});
setInterval(()=>{
  if(!active)return;
  const t=document.querySelector("[data-clock='total']");if(t)t.textContent=clock(Date.now()-active.startedAt);
  const r=document.querySelector("[data-clock='rest']");if(r&&active.restFrom){r.textContent=clock(Date.now()-active.restFrom);r.parentElement.hidden=false}
},1000);

/* ---------- boot ---------- */
render();
(async function boot(){
  await store.init();
  store.subscribe("templates",docs=>{templates=docs;ready.templates=true;refreshDatalist();if(ready.active)render()});
  store.subscribe("sessions",docs=>{sessions=docs.sort((a,b)=>(b.finishedAt||0)-(a.finishedAt||0));ready.sessions=true;refreshDatalist();if(ready.active)render()});
  store.subscribe("body",docs=>{body=docs;if(ready.active)render()});
  try{active=await store.getActive()}catch(e){active=null}
  ready.active=true;render();if(active)keepAwake();
})();
if("serviceWorker" in navigator&&location.protocol!=="file:"){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
})();
</script>
</body>
</html>
